<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QuizBlast — חידונים בזמן אמת</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0c29;
    --bg2: #1a1540;
    --card: #231e52;
    --card2: #2d2768;
    --accent: #f9ca24;
    --accent2: #00e5ff;
    --pink: #ff6b9d;
    --green: #6bff7e;
    --text: #ffffff;
    --muted: #9b94d1;
    --r: 14px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Rubik', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* bg decoration */
  body::before {
    content: '';
    position: fixed; inset: 0; z-index: 0;
    background:
      radial-gradient(ellipse 60% 40% at 10% 20%, #3d1a6e33, transparent),
      radial-gradient(ellipse 50% 60% at 90% 80%, #1a0a5e44, transparent);
    pointer-events: none;
  }

  .screen { display: none; min-height: 100vh; position: relative; z-index: 1; }
  .screen.active { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }

  /* ── LOGO ── */
  .logo {
    font-family: 'Nunito', sans-serif;
    font-weight: 900;
    font-size: clamp(2.8rem, 10vw, 5.5rem);
    letter-spacing: -2px;
    background: linear-gradient(135deg, var(--pink) 0%, var(--accent) 50%, var(--accent2) 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: logoPulse 3s ease-in-out infinite;
  }
  @keyframes logoPulse { 0%,100%{filter:brightness(1)} 50%{filter:brightness(1.25)} }
  .tagline { color: var(--muted); font-size: 1rem; margin: 8px 0 36px; letter-spacing: 1px; }

  /* ── BUTTONS ── */
  .btn-row { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
  .btn {
    padding: 15px 34px; border: none; border-radius: 50px;
    font-family: 'Nunito', sans-serif; font-size: 1.05rem; font-weight: 800;
    cursor: pointer; transition: transform .18s, box-shadow .18s; position: relative; overflow: hidden;
  }
  .btn:hover { transform: translateY(-3px); box-shadow: 0 14px 32px rgba(0,0,0,.45); }
  .btn:active { transform: scale(.97); }
  .btn-host { background: linear-gradient(135deg, var(--pink), #b5004a); color: #fff; }
  .btn-join { background: linear-gradient(135deg, var(--accent2), #007fa8); color: #0f0c29; }
  .btn-gold  { background: linear-gradient(135deg, var(--accent), #e07b00); color: #0f0c29; }
  .btn-outline { background: transparent; border: 2px solid var(--muted); color: var(--muted); padding: 11px 26px; font-size: .95rem; }
  .btn-sm { padding: 10px 22px; font-size: .9rem; }
  .btn-danger { background: linear-gradient(135deg, #ff4757, #c0392b); color: #fff; }

  /* ── CARD ── */
  .card {
    background: var(--card); border-radius: var(--r);
    padding: 30px 28px; width: 100%; max-width: 460px;
    border: 1px solid rgba(255,255,255,.07);
  }
  .card h2 {
    font-family: 'Nunito', sans-serif; font-weight: 900;
    font-size: 1.5rem; margin-bottom: 22px; text-align: center;
  }

  /* ── INPUTS ── */
  input[type=text], input[type=number], textarea, select {
    width: 100%; padding: 13px 16px;
    background: var(--bg2); border: 1.5px solid rgba(255,255,255,.1);
    border-radius: 10px; color: #fff;
    font-family: 'Rubik', sans-serif; font-size: .95rem;
    margin-bottom: 14px; outline: none; transition: border-color .2s;
  }
  input:focus, textarea:focus { border-color: var(--accent2); }
  input::placeholder, textarea::placeholder { color: var(--muted); }
  label.field-label { font-size: .85rem; color: var(--muted); display: block; margin-bottom: 5px; }

  /* ── TOPIC GRID ── */
  .topic-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-bottom: 18px; }
  .topic-btn {
    padding: 11px 8px; background: var(--bg2);
    border: 1.5px solid rgba(255,255,255,.1); border-radius: 10px;
    color: var(--text); font-family: 'Rubik', sans-serif; font-weight: 500;
    font-size: .9rem; cursor: pointer; transition: all .18s; text-align: center;
  }
  .topic-btn:hover { border-color: var(--accent2); background: var(--card2); }
  .topic-btn.sel { border-color: var(--accent2); background: #00e5ff18; color: var(--accent2); }

  /* ── LOBBY ── */
  .room-code {
    background: linear-gradient(135deg, var(--accent), #e07b00);
    color: #0f0c29; font-family: 'Nunito', sans-serif; font-weight: 900;
    font-size: clamp(2rem, 8vw, 3.5rem); letter-spacing: 10px;
    text-align: center; padding: 18px 28px; border-radius: var(--r);
    margin-bottom: 20px;
  }
  .players-wrap { width: 100%; max-width: 540px; }
  .players-grid {
    display: flex; flex-wrap: wrap; gap: 8px;
    max-height: 180px; overflow-y: auto; margin-bottom: 18px;
    justify-content: center;
  }
  .chip {
    background: var(--card2); border-radius: 50px;
    padding: 7px 16px; font-size: .85rem; font-weight: 600;
    border: 1px solid rgba(255,255,255,.1);
    animation: popIn .3s cubic-bezier(.175,.885,.32,1.275);
  }
  @keyframes popIn { from{transform:scale(0);opacity:0} to{transform:scale(1);opacity:1} }
  .count-txt { color: var(--muted); text-align: center; font-size: .9rem; margin-bottom: 14px; }

  /* ── WAITING (player) ── */
  .dots { display: flex; gap: 9px; margin-bottom: 22px; }
  .dot { width: 14px; height: 14px; border-radius: 50%; animation: bounce 1.2s infinite; }
  .dot:nth-child(1){background:var(--pink);animation-delay:0s}
  .dot:nth-child(2){background:var(--accent2);animation-delay:.2s}
  .dot:nth-child(3){background:var(--accent);animation-delay:.4s}
  @keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-18px)}}

  /* ── QUESTION ── */
  .q-header {
    width: 100%; max-width: 860px;
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 18px;
  }
  .q-badge {
    background: var(--card); padding: 7px 18px; border-radius: 50px;
    font-weight: 600; font-size: .85rem; border: 1px solid rgba(255,255,255,.1);
  }
  .timer {
    width: 66px; height: 66px; border-radius: 50%;
    background: var(--card); border: 3.5px solid var(--accent2);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Nunito', sans-serif; font-weight: 900; font-size: 1.7rem;
    transition: border-color .3s;
  }
  .timer.urgent { border-color: var(--pink); animation: urgentPulse .5s infinite; }
  @keyframes urgentPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}

  .progress-wrap {
    width: 100%; max-width: 860px; height: 7px;
    background: var(--card); border-radius: 4px; margin-bottom: 18px; overflow: hidden;
  }
  .progress-bar {
    height: 100%;
    background: linear-gradient(90deg, var(--accent2), var(--pink));
    border-radius: 4px; transition: width 1s linear;
  }

  .q-card {
    background: var(--card); border-radius: var(--r);
    padding: 28px 24px; width: 100%; max-width: 860px;
    text-align: center; margin-bottom: 20px;
    border: 1px solid rgba(255,255,255,.07);
  }
  .q-text {
    font-family: 'Nunito', sans-serif; font-weight: 800;
    font-size: clamp(1.1rem, 3vw, 1.7rem); line-height: 1.45;
  }

  .answers-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; width: 100%; max-width: 860px; }
  .ans-btn {
    padding: 18px 14px; border: none; border-radius: var(--r);
    font-family: 'Nunito', sans-serif; font-weight: 800;
    font-size: clamp(.9rem, 2.5vw, 1.15rem);
    cursor: pointer; transition: transform .18s, filter .18s;
    display: flex; align-items: center; gap: 10px; text-align: right;
  }
  .ans-btn .shape { width: 26px; height: 26px; border-radius: 4px; flex-shrink: 0; opacity: .35; }
  .ans-btn:nth-child(1){background:#e63946;color:#fff}
  .ans-btn:nth-child(2){background:#2196f3;color:#fff}
  .ans-btn:nth-child(3){background:#f9a825;color:#0f0c29}
  .ans-btn:nth-child(4){background:#43a047;color:#fff}
  .ans-btn:hover:not(:disabled){transform:scale(1.03);filter:brightness(1.1)}
  .ans-btn:disabled{cursor:not-allowed}
  .ans-btn.selected{outline:4px solid #fff;transform:scale(1.05)}
  .ans-btn.correct-reveal{background:#4caf50!important;outline:3px solid #fff}
  .ans-btn.wrong{background:#555!important;opacity:.55}

  /* ── SCORE BADGE (floating) ── */
  .score-float {
    position: fixed; top: 14px; left: 14px; z-index: 50;
    background: linear-gradient(135deg, var(--accent), #e07b00);
    color: #0f0c29; padding: 7px 16px; border-radius: 50px;
    font-family: 'Nunito', sans-serif; font-weight: 900; font-size: .95rem;
  }
  .mode-float {
    position: fixed; top: 14px; right: 14px; z-index: 50;
    background: var(--card); border: 1px solid rgba(255,255,255,.1);
    padding: 7px 14px; border-radius: 50px;
    font-size: .8rem; font-weight: 600; color: var(--muted);
  }

  /* ── FEEDBACK OVERLAY ── */
  .feedback-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.88);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; z-index: 200;
    animation: fadeIn .25s;
  }
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .fb-icon { font-size: 5rem; margin-bottom: 14px; animation: bounceIn .4s; }
  @keyframes bounceIn{0%{transform:scale(0)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
  .fb-title { font-family:'Nunito',sans-serif; font-weight:900; font-size:2.4rem; margin-bottom:6px; }
  .fb-pts { font-size:1.4rem; font-weight:800; color:var(--accent); margin-bottom:6px; }
  .fb-rank { font-size:.95rem; color:var(--muted); }

  /* ── LEADERBOARD ── */
  .lb-title {
    font-family:'Nunito',sans-serif; font-weight:900;
    font-size:clamp(1.8rem,6vw,2.8rem);
    background: linear-gradient(135deg,var(--accent),var(--pink));
    -webkit-background-clip:text; -webkit-text-fill-color:transparent;
    background-clip:text; margin-bottom:28px; text-align:center;
  }
  .lb-list { width:100%; max-width:480px; }
  .lb-entry {
    display:flex; align-items:center; gap:14px;
    background:var(--card); border-radius:12px;
    padding:13px 18px; margin-bottom:9px;
    border:1px solid rgba(255,255,255,.07);
    animation:slideIn .4s cubic-bezier(.175,.885,.32,1.275) both;
  }
  .lb-entry:nth-child(1){border-color:var(--accent);background:linear-gradient(135deg,#3d2a00,var(--card))}
  .lb-entry:nth-child(2){border-color:#9e9e9e}
  .lb-entry:nth-child(3){border-color:#8d6e63}
  @keyframes slideIn{from{transform:translateX(40px);opacity:0}to{transform:translateX(0);opacity:1}}
  .lb-rank{font-family:'Nunito',sans-serif;font-weight:900;font-size:1.3rem;width:28px;text-align:center}
  .lb-name{flex:1;font-weight:600;font-size:1rem}
  .lb-score{font-family:'Nunito',sans-serif;font-weight:900;font-size:1.1rem;color:var(--accent)}

  /* ── AI STATUS ── */
  .ai-status {
    display:flex;align-items:center;gap:9px;
    color:var(--muted);font-size:.88rem;margin-top:12px;justify-content:center;
  }
  .spinner {
    width:18px;height:18px;
    border:2px solid rgba(255,255,255,.15);
    border-top-color:var(--accent2);
    border-radius:50%;animation:spin .7s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  .err{color:var(--pink);font-size:.88rem;text-align:center;margin-top:6px}

  /* ── QR CODE ── */
  .qr-wrap {
    background:#fff;border-radius:10px;
    padding:12px;display:inline-block;margin:0 auto 16px;
  }

  /* scrollbar */
  ::-webkit-scrollbar{width:5px}
  ::-webkit-scrollbar-track{background:var(--bg2)}
  ::-webkit-scrollbar-thumb{background:var(--card2);border-radius:3px}

  @media(max-width:520px){
    .answers-grid{grid-template-columns:1fr}
    .card{padding:22px 16px}
    .topic-grid{grid-template-columns:1fr 1fr}
  }
</style>
</head>
<body>

<!-- ══════════════ WELCOME ══════════════ -->
<div class="screen active" id="s-welcome">
  <div class="logo">⚡ QuizBlast</div>
  <p class="tagline">חידונים אינטראקטיביים · בזמן אמת</p>
  <div class="btn-row">
    <button class="btn btn-host" onclick="go('s-host-setup')">🎮 אני מנחה</button>
    <button class="btn btn-join" onclick="go('s-join')">🙋 אני שחקן</button>
  </div>
</div>

<!-- ══════════════ HOST SETUP ══════════════ -->
<div class="screen" id="s-host-setup">
  <div class="card">
    <h2>🎯 יצירת חידון</h2>

    <div class="topic-grid" id="topic-grid">
      <button class="topic-btn" onclick="pickTopic(this,'יעוץ לימודים')">🎓 יעוץ לימודים</button>
      <button class="topic-btn" onclick="pickTopic(this,'מסלולי לימוד')">📚 מסלולי לימוד</button>
      <button class="topic-btn" onclick="pickTopic(this,'מכללות ואוניברסיטאות')">🏛️ מוסדות</button>
      <button class="topic-btn" onclick="pickTopic(this,'מלגות ומימון')">💰 מלגות</button>
      <button class="topic-btn" onclick="pickTopic(this,'היסטוריה')">📜 היסטוריה</button>
      <button class="topic-btn" onclick="pickTopic(this,'כללי')">🌍 כללי</button>
    </div>

    <label class="field-label">או נושא משלך:</label>
    <input type="text" id="custom-topic" placeholder="למשל: פסיכולוגיה חינוכית..." />

    <div style="display:flex;align-items:center;gap:10px;margin-bottom:18px">
      <label class="field-label" style="margin:0;white-space:nowrap">מספר שאלות:</label>
      <input type="number" id="q-count" value="5" min="3" max="10" style="width:80px;margin:0" />
    </div>

    <button class="btn btn-gold" style="width:100%" id="create-btn" onclick="hostCreate()">✨ צור שאלות עם AI</button>
    <div id="ai-msg"></div>
    <div id="create-err" class="err"></div>
    <div style="margin-top:10px;text-align:center">
      <label style="font-size:.85rem;color:var(--muted);cursor:pointer;">
        📂 או ייבא קובץ JSON שמור
        <input type="file" accept=".json" onchange="importQuiz(event)" style="display:none" />
      </label>
    </div>
    <button class="btn btn-outline btn-sm" style="width:100%;margin-top:12px" onclick="go('s-welcome')">← חזרה</button>
  </div>
</div>

<!-- ══════════════ HOST LOBBY ══════════════ -->
<div class="screen" id="s-host-lobby">
  <div class="mode-float">👑 מנחה</div>
  <p style="color:var(--muted);font-size:.9rem;margin-bottom:8px;text-align:center">שלח את הקוד הזה לשחקנים:</p>
  <div class="room-code" id="room-code-disp">----</div>
  <div class="players-wrap">
    <p class="count-txt" id="count-txt">ממתין לשחקנים...</p>
    <div class="players-grid" id="players-grid"></div>
    <div class="btn-row">
      <button class="btn btn-gold" id="start-btn" onclick="hostStart()" disabled>🚀 התחל משחק</button>
      <button class="btn btn-outline btn-sm" onclick="go('s-welcome')">ביטול</button>
    </div>
  </div>
</div>

<!-- ══════════════ JOIN ══════════════ -->
<div class="screen" id="s-join">
  <div class="card">
    <h2>🎮 הצטרף למשחק</h2>
    <label class="field-label">קוד חדר (4 ספרות)</label>
    <input type="text" id="join-code" maxlength="4" inputmode="numeric" placeholder="1234" oninput="this.value=this.value.replace(/\D/g,'')" style="font-size:2rem;letter-spacing:8px;text-align:center;font-family:'Nunito',sans-serif;font-weight:900" />
    <label class="field-label">שם כינוי</label>
    <input type="text" id="join-name" placeholder="השם שיוצג לכולם" maxlength="20" />
    <button class="btn btn-join" style="width:100%" onclick="playerJoin()">⚡ הצטרף</button>
    <div id="join-err" class="err"></div>
    <button class="btn btn-outline btn-sm" style="width:100%;margin-top:12px" onclick="go('s-welcome')">← חזרה</button>
  </div>
</div>

<!-- ══════════════ PLAYER WAITING ══════════════ -->
<div class="screen" id="s-waiting">
  <div class="mode-float" id="wait-badge">שחקן</div>
  <div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
  <h2 id="wait-name" style="font-family:'Nunito',sans-serif;font-weight:900;font-size:2rem;margin-bottom:8px">שלום!</h2>
  <p style="color:var(--muted)">ממתינים שהמנחה יתחיל...</p>
  <p style="color:var(--muted);font-size:.85rem;margin-top:8px">
    קוד חדר: <span id="wait-code" style="color:var(--accent2);font-weight:700"></span>
  </p>
</div>

<!-- ══════════════ QUESTION ══════════════ -->
<div class="screen" id="s-question">
  <div class="score-float" id="score-float">0 נק'</div>
  <div class="mode-float" id="q-mode-float">שחקן</div>

  <div class="q-header">
    <div class="q-badge" id="q-counter">שאלה 1/5</div>
    <div class="timer" id="timer">10</div>
  </div>

  <div class="progress-wrap">
    <div class="progress-bar" id="progress-bar" style="width:100%"></div>
  </div>

  <div class="q-card">
    <div class="q-text" id="q-text">טוען...</div>
  </div>

  <div class="answers-grid" id="answers-grid">
    <button class="ans-btn"><div class="shape" style="border-radius:50%"></div><span>...</span></button>
    <button class="ans-btn"><div class="shape"></div><span>...</span></button>
    <button class="ans-btn"><div class="shape" style="clip-path:polygon(50% 0%,100% 100%,0% 100%)"></div><span>...</span></button>
    <button class="ans-btn"><div class="shape" style="clip-path:polygon(50% 0%,100% 50%,50% 100%,0% 50%)"></div><span>...</span></button>
  </div>
</div>

<!-- ══════════════ LEADERBOARD ══════════════ -->
<div class="screen" id="s-leaderboard">
  <div class="lb-title">🏆 טבלת מובילים</div>
  <div class="lb-list" id="lb-list"></div>
  <div class="btn-row" style="margin-top:24px" id="lb-actions"></div>
</div>

<!-- ══════════════ FINAL ══════════════ -->
<div class="screen" id="s-final">
  <div style="font-size:5rem;margin-bottom:16px;animation:bounceIn .5s">🎉</div>
  <div class="lb-title">המשחק נגמר!</div>
  <div class="lb-list" id="final-lb"></div>
  <div class="btn-row" style="margin-top:24px">
    <button class="btn btn-gold" onclick="go('s-welcome')">משחק חדש</button>
    <button class="btn btn-outline btn-sm" onclick="exportResults()">💾 שמור תוצאות</button>
  </div>
</div>

<!-- ══════════════ FEEDBACK OVERLAY ══════════════ -->
<div class="feedback-overlay" id="feedback" style="display:none">
  <div class="fb-icon" id="fb-icon">✅</div>
  <div class="fb-title" id="fb-title">נכון!</div>
  <div class="fb-pts" id="fb-pts">+850 נקודות</div>
  <div class="fb-rank" id="fb-rank"></div>
</div>

<script>
/* ════════════════════════════════════════
   STATE
════════════════════════════════════════ */
const S = {
  mode: null,          // 'host' | 'player'
  code: null,
  name: null,
  quiz: null,          // {topic, questions:[{q,answers,correct}]}
  qIdx: 0,
  score: 0,
  players: {},         // name→score
  timerInt: null,
  timeLeft: 10,
  totalTime: 10,
  startTime: 0,
  answered: false,
  topic: null,
};

// Shared in-memory room store
const ROOMS = {};

/* ════════════════════════════════════════
   NAVIGATION
════════════════════════════════════════ */
function go(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0,0);
}

/* ════════════════════════════════════════
   TOPIC SELECT
════════════════════════════════════════ */
function pickTopic(btn, t) {
  document.querySelectorAll('.topic-btn').forEach(b => b.classList.remove('sel'));
  btn.classList.add('sel');
  S.topic = t;
  document.getElementById('custom-topic').value = '';
}

/* ════════════════════════════════════════
   AI QUIZ GENERATION
════════════════════════════════════════ */
async function generateQuiz(topic, count) {
  const prompt = `You are a professional quiz master. Generate exactly ${count} multiple-choice questions about "${topic}" in Hebrew.

Return ONLY a valid JSON array. No markdown, no explanation, no code fences.
Format: [{"q":"שאלה?","answers":["תשובה א","תשובה ב","תשובה ג","תשובה ד"],"correct":INDEX}]

Rules:
- All text must be in Hebrew
- "correct" is the 0-based index of the correct answer
- Vary which index is correct — not always 0
- Questions should be clear, interesting, and varied in difficulty
- Each answer should be plausible`;

  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      model: 'claude-sonnet-4-20250514',
      max_tokens: 1500,
      messages: [{ role: 'user', content: prompt }]
    })
  });
  const data = await res.json();
  const raw = data.content.map(c => c.text || '').join('');
  const clean = raw.replace(/```json|```/g, '').trim();
  return JSON.parse(clean);
}

/* ════════════════════════════════════════
   HOST FLOW
════════════════════════════════════════ */
async function hostCreate() {
  const custom = document.getElementById('custom-topic').value.trim();
  const topic = custom || S.topic;
  const count = parseInt(document.getElementById('q-count').value) || 5;
  const errEl = document.getElementById('create-err');
  const btn   = document.getElementById('create-btn');
  const aiMsg = document.getElementById('ai-msg');

  errEl.textContent = '';
  if (!topic) { errEl.textContent = 'בחר נושא או הקלד נושא משלך'; return; }

  btn.disabled = true;
  aiMsg.innerHTML = `<div class="ai-status"><div class="spinner"></div><span>AI מכין ${count} שאלות על "${topic}"...</span></div>`;

  try {
    const qs = await generateQuiz(topic, count);
    S.quiz = { topic, questions: qs, createdAt: new Date().toISOString() };
    S.mode = 'host';
    S.code = String(Math.floor(1000 + Math.random() * 9000));
    S.players = {};
    S.qIdx = 0;
    S.score = 0;
    ROOMS[S.code] = { quiz: S.quiz, players: S.players, status: 'lobby', qIdx: 0 };

    aiMsg.innerHTML = '';
    btn.disabled = false;
    document.getElementById('room-code-disp').textContent = S.code;
    refreshLobby();
    go('s-host-lobby');
  } catch(e) {
    console.error(e);
    aiMsg.innerHTML = '';
    btn.disabled = false;
    errEl.textContent = 'שגיאה ביצירת שאלות. נסה שוב.';
  }
}

function importQuiz(evt) {
  const file = evt.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      const quiz = data.questions ? data : data.quiz;
      if (!quiz || !quiz.questions) throw new Error('format');
      S.quiz = quiz;
      S.mode = 'host';
      S.code = String(Math.floor(1000 + Math.random() * 9000));
      S.players = {};
      S.qIdx = 0;
      ROOMS[S.code] = { quiz: S.quiz, players: S.players, status: 'lobby', qIdx: 0 };
      document.getElementById('room-code-disp').textContent = S.code;
      refreshLobby();
      go('s-host-lobby');
    } catch { document.getElementById('create-err').textContent = 'קובץ לא תקין'; }
  };
  reader.readAsText(file);
}

function refreshLobby() {
  const names = Object.keys(S.players);
  document.getElementById('players-grid').innerHTML =
    names.map(n => `<div class="chip">🎮 ${n}</div>`).join('');
  document.getElementById('count-txt').textContent =
    names.length === 0 ? 'ממתין לשחקנים...' : `${names.length} שחקן${names.length===1?'':'ים'} בלובי`;
  document.getElementById('start-btn').disabled = names.length === 0;
}

function hostStart() {
  if (!Object.keys(S.players).length) return;
  ROOMS[S.code].status = 'playing';
  ROOMS[S.code].qIdx = 0;
  S.qIdx = 0;
  showQ(0, 'host');
}

/* ════════════════════════════════════════
   PLAYER FLOW
════════════════════════════════════════ */
function playerJoin() {
  const code = document.getElementById('join-code').value.trim();
  const name = document.getElementById('join-name').value.trim();
  const err  = document.getElementById('join-err');

  if (code.length !== 4) { err.textContent = 'קוד חדר חייב להיות 4 ספרות'; return; }
  if (!name)             { err.textContent = 'הכנס שם כינוי'; return; }
  if (!ROOMS[code])      { err.textContent = 'חדר לא נמצא. בדוק את הקוד.'; return; }
  if (ROOMS[code].status !== 'lobby') { err.textContent = 'המשחק כבר התחיל.'; return; }
  if (ROOMS[code].players[name]) { err.textContent = 'השם תפוס — בחר אחר.'; return; }

  err.textContent = '';
  S.mode = 'player';
  S.code = code;
  S.name = name;
  S.score = 0;
  S.qIdx = 0;
  ROOMS[code].players[name] = 0;
  S.players = ROOMS[code].players;
  S.quiz    = ROOMS[code].quiz;

  refreshLobby();
  document.getElementById('wait-name').textContent = `שלום, ${name}!`;
  document.getElementById('wait-code').textContent = code;
  document.getElementById('wait-badge').textContent = `🎮 ${name}`;
  go('s-waiting');
  pollStart();
}

function pollStart() {
  const iv = setInterval(() => {
    const room = ROOMS[S.code];
    if (!room) { clearInterval(iv); return; }
    if (room.status === 'playing') {
      clearInterval(iv);
      S.quiz = room.quiz;
      showQ(0, 'player');
    }
  }, 400);
}

/* ════════════════════════════════════════
   QUESTION ENGINE
════════════════════════════════════════ */
const SHAPES = [
  'border-radius:50%',
  '',
  'clip-path:polygon(50% 0%,100% 100%,0% 100%)',
  'clip-path:polygon(50% 0%,100% 50%,50% 100%,0% 50%)'
];

function showQ(idx, mode) {
  const q     = S.quiz.questions[idx];
  const total = S.quiz.questions.length;
  S.answered  = false;

  document.getElementById('q-counter').textContent   = `שאלה ${idx+1}/${total}`;
  document.getElementById('q-mode-float').textContent = mode==='host' ? '👑 מנחה' : `🎮 ${S.name}`;
  document.getElementById('score-float').textContent  = `${S.score.toLocaleString()} נק'`;
  document.getElementById('q-text').textContent       = q.q;

  document.getElementById('answers-grid').innerHTML = q.answers.map((a,i) =>
    `<button class="ans-btn" id="ans${i}" onclick="pick(${i})">
      <div class="shape" style="${SHAPES[i]}"></div>
      <span>${a}</span>
    </button>`
  ).join('');

  if (mode === 'host') {
    document.querySelectorAll('.ans-btn').forEach(b => b.disabled = true);
  }

  go('s-question');
  startTimer(mode);
}

function startTimer(mode) {
  clearInterval(S.timerInt);
  S.timeLeft  = S.totalTime;
  S.startTime = Date.now();
  const timerEl = document.getElementById('timer');
  const pb      = document.getElementById('progress-bar');
  timerEl.classList.remove('urgent');

  S.timerInt = setInterval(() => {
    S.timeLeft--;
    timerEl.textContent = S.timeLeft;
    pb.style.width = `${(S.timeLeft/S.totalTime)*100}%`;
    if (S.timeLeft <= 3) timerEl.classList.add('urgent');
    if (S.timeLeft <= 0) {
      clearInterval(S.timerInt);
      if (!S.answered) {
        mode === 'host' ? revealAndAdvance() : showFeedback(false, 0);
      }
    }
  }, 1000);
}

function pick(idx) {
  if (S.answered) return;
  S.answered = true;
  clearInterval(S.timerInt);

  const q       = S.quiz.questions[S.qIdx];
  const correct = q.correct;
  const ok      = idx === correct;
  const elapsed = (Date.now() - S.startTime) / 1000;
  let pts = 0;

  if (ok) {
    pts = Math.round(Math.max(500, 1000 - (elapsed / S.totalTime) * 500));
    S.score += pts;
    if (ROOMS[S.code]) ROOMS[S.code].players[S.name] = S.score;
  }

  document.querySelectorAll('.ans-btn').forEach((b,i) => {
    b.disabled = true;
    if (i === idx) b.classList.add('selected');
  });

  setTimeout(() => {
    document.querySelectorAll('.ans-btn').forEach((b,i) => {
      if (i === correct) b.classList.add('correct-reveal');
      else if (i === idx && !ok) b.classList.add('wrong');
    });
    const rank = rankOf(S.name);
    const tot  = Object.keys(S.players).length;
    showFeedback(ok, pts, rank, tot);
  }, 400);
}

function revealAndAdvance() {
  const q = S.quiz.questions[S.qIdx];
  document.querySelectorAll('.ans-btn').forEach((b,i) => {
    b.disabled = true;
    if (i === q.correct) b.classList.add('correct-reveal');
  });
  setTimeout(() => advance('host'), 2000);
}

function rankOf(name) {
  const sorted = Object.entries(S.players).sort((a,b) => b[1]-a[1]);
  return sorted.findIndex(([n]) => n===name) + 1;
}

function showFeedback(ok, pts, rank, tot) {
  document.getElementById('fb-icon').textContent  = ok ? '✅' : '❌';
  document.getElementById('fb-title').textContent = ok ? 'נכון! 🎉' : 'טעות...';
  document.getElementById('fb-pts').textContent   = ok ? `+${pts} נקודות` : '0 נקודות';
  document.getElementById('fb-rank').textContent  = rank ? `מקום ${rank} מתוך ${tot}` : '';
  document.getElementById('score-float').textContent = `${S.score.toLocaleString()} נק'`;
  document.getElementById('feedback').style.display = 'flex';

  setTimeout(() => {
    document.getElementById('feedback').style.display = 'none';
    advance('player');
  }, 2300);
}

function advance(mode) {
  S.qIdx++;
  const total = S.quiz.questions.length;
  if (S.qIdx >= total) {
    showLB(true);
  } else {
    if (mode === 'host') {
      ROOMS[S.code].qIdx = S.qIdx;
      showLB(false);
    } else {
      showQ(S.qIdx, 'player');
    }
  }
}

/* ════════════════════════════════════════
   LEADERBOARD
════════════════════════════════════════ */
const MEDALS = ['🥇','🥈','🥉'];

function renderLBEntries(elId) {
  const entries = Object.entries(S.players).sort((a,b) => b[1]-a[1]);
  document.getElementById(elId).innerHTML = entries.slice(0,8).map(([name,score],i) =>
    `<div class="lb-entry" style="animation-delay:${i*.1}s">
      <div class="lb-rank">${MEDALS[i]||i+1}</div>
      <div class="lb-name">${name}${name===S.name?' (אתה)':''}</div>
      <div class="lb-score">${score.toLocaleString()}</div>
    </div>`
  ).join('');
}

function showLB(isFinal) {
  if (isFinal) {
    renderLBEntries('final-lb');
    go('s-final');
    return;
  }
  renderLBEntries('lb-list');
  const acts = document.getElementById('lb-actions');
  if (S.mode === 'host') {
    acts.innerHTML = `<button class="btn btn-gold" onclick="hostNextQ()">שאלה הבאה ▶</button>`;
  } else {
    acts.innerHTML = `<p style="color:var(--muted);font-size:.9rem">ממתין למנחה...</p>`;
    setTimeout(() => showQ(S.qIdx, 'player'), 3000);
  }
  go('s-leaderboard');
}

function hostNextQ() {
  ROOMS[S.code].qIdx = S.qIdx;
  showQ(S.qIdx, 'host');
}

/* ════════════════════════════════════════
   EXPORT RESULTS
════════════════════════════════════════ */
function exportResults() {
  const data = {
    quiz: S.quiz,
    results: Object.entries(S.players).sort((a,b) => b[1]-a[1]).map(([name,score],i) => ({
      rank: i+1, name, score
    })),
    exportedAt: new Date().toISOString()
  };
  const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url; a.download = 'quizblast_results.json'; a.click();
  URL.revokeObjectURL(url);
}
